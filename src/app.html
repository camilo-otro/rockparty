<!doctype html>
<html lang="en" style="background-color: #1A1A1A">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Installable (#103). The manifest carries the name, the dark splash and
		     the maskable icons; these tags are the bits iOS reads instead, since
		     Safari still ignores most of the manifest on the home screen. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#1A1A1A" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- "black", not "black-translucent": translucent puts the page under the
		     status bar, which would need safe-area padding on every screen. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="apple-mobile-web-app-title" content="Rock the House" />

		<!-- Open Graph is set per-route in <svelte:head> (SSR). The public flyer
		     (/toque/[id], #68) renders per-event tags; keeping brand-level tags here
		     too would duplicate og:title and crawlers pick the first, so it's not
		     done in this static shell. -->
		%sveltekit.head%
	</head>
	<!-- Dark ground on the bare shell so the pre-hydration frame (CSR-only, #48)
	     never flashes white before the dark app paints. -->
	<body data-sveltekit-preload-data="hover" style="background-color: #1A1A1A">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
